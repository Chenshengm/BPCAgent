[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpcagent"
version = "0.1.0"
description = "A minimal Python framework for agents and tool calling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66,<3",
    "pydantic>=2.7,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
examples = ["python-dotenv>=1,<2"]
dev = ["build>=1,<2"]
test = ["pytest>=7,<9"]

[project.scripts]
bpc-workflow = "bpcagent.workflow.cli:main"
bpc-state = "bpc_state.cli:main"

[tool.setuptools]
package-dir = {"bpcagent" = "src", "bpc_state" = "vendor/BPC_PatientState/src/bpc_state", "bpc_state.resources" = "vendor/BPC_PatientState/config"}
packages = ["bpcagent", "bpcagent.agents", "bpcagent.tools", "bpcagent.sandbox", "bpcagent.tasks", "bpcagent.workflow", "bpc_state", "bpc_state.resources"]
include-package-data = false

[tool.setuptools.package-data]
"bpc_state.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "vendor/BPC_PatientState/tests"]
