[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpcagent"
version = "0.1.0"
description = "A minimal Python framework for agents and tool calling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30,<3",
    "pydantic>=2.7,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
examples = ["python-dotenv>=1,<2"]
dev = ["build>=1,<2"]

[tool.setuptools]
package-dir = {"bpcagent" = "src"}
packages = ["bpcagent", "bpcagent.agents", "bpcagent.tools", "bpcagent.sandbox", "bpcagent.tasks"]
include-package-data = false
